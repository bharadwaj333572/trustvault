name: TrustVault CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify:
    name: Lint, Typecheck & Security Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: trustvault
          POSTGRES_PASSWORD: trustvault_test_password
          POSTGRES_DB: trustvault_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Run Schema Migrations
        env:
          DATABASE_URL: postgresql://trustvault:trustvault_test_password@localhost:5432/trustvault_test
        run: npx tsx src/server/db/migrate.ts

      - name: Run Tests (Unit, Security, Policy)
        env:
          DATABASE_URL: postgresql://trustvault:trustvault_test_password@localhost:5432/trustvault_test
          STORAGE_DIR: ./storage
          SESSION_SECRET: test_session_secret_at_least_32_characters_long_for_ci
        run: npm test -- --no-file-parallelism
